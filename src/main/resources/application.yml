server:
  port: 8089

spring:
  application:
    name: data-workshop
  # ========== 数据库配置（账号密码走环境变量，不写死、不进仓库） ==========
  datasource:
    # 真实 MySQL（默认）。环境变量未设置时用下面的本地地址
    url: ${DB_URL:jdbc:mysql://localhost:3306/workshop?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  # 实体类别名包，XML 里可写短名 Record
  type-aliases-package: com.studio.data.model
  # Mapper XML 位置
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.studio.data: DEBUG
